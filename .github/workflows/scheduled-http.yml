name: Later scheduled HTTP
on:
  push:
    branches: [main]
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: later-esa-tick
  cancel-in-progress: false
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/trigger.ts
        env:
          LATER_URL: ${{ vars.LATER_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
